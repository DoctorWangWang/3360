# ===========================================================================
# charybdis_cirque_right (3360 主手 / central) — 官方 ZMK v0.3 + PMW3360 轨迹球
# ===========================================================================

# ---------------------------------------------------------------------------
# 输入 / pointing / 鼠标
# ---------------------------------------------------------------------------
CONFIG_INPUT=y
CONFIG_SPI=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# ---------------------------------------------------------------------------
# PMW3360 轨迹球（KOHSUK/zmk-pmw3360-driver 模块，compatible "pixart,pmw3360"）
# ---------------------------------------------------------------------------
CONFIG_PMW3360=y

# 轨迹球 CPI / 灵敏度（Kconfig 取值范围 100–12000，DIVIDOR 1–12）
CONFIG_PMW3360_CPI=2000
CONFIG_PMW3360_CPI_DIVIDOR=1
# 空闲 200 ms 即降采样率省电（默认 500 ms）。注意：conf 里不能写行尾注释
CONFIG_PMW3360_RUN_DOWNSHIFT_TIME_MS=200

# ---------------------------------------------------------------------------
# 官方 ZMK Studio（https://zmk.studio）——在线改键
# USB 端点由 build.yaml 的 studio-rpc-usb-uart snippet 提供
# ---------------------------------------------------------------------------
CONFIG_ZMK_STUDIO=y

# ---------------------------------------------------------------------------
# 编码器 / 显示屏
# ---------------------------------------------------------------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y

# ---------------------------------------------------------------------------
# 电源 / 休眠：保持唤醒，不进 idle、不进深度休眠
# ---------------------------------------------------------------------------
# 深度休眠（system off，靠按键唤醒）显式关闭。ZMK 默认即 n，这里写死防止上游默认值变化
CONFIG_ZMK_SLEEP=n
# 空闲判定阈值 30 s -> 24 h：activity 状态始终为 ACTIVE，
# 由 idle 触发的熄屏、外设断电都不会发生（真正需要休眠可把这个值调小）
CONFIG_ZMK_IDLE_TIMEOUT=86400000

# 传输功率
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# combo / 消抖
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=40
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=40
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=20
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20
