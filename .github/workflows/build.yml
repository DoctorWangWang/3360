name: Build ZMK firmware

# charybdis_cirque (3360) — 官方 ZMK v0.3（Zephyr 3.5）+ 官方 ZMK Studio
#
# 固定使用官方 3.5 镜像（Zephyr 3.5 / SDK 0.16.3），不引用 reusable workflow，
# 避免上游更新把构建环境悄悄换掉。PMW3360 驱动经 west 项目（KOHSUK）引入。
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:3.5
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nice_nano_v2
            shield: charybdis_cirque_left
            snippet: nrf52840-nosd
          - board: nice_nano_v2
            shield: charybdis_cirque_right
            snippet: nrf52840-nosd studio-rpc-usb-uart
          - board: nice_nano_v2
            shield: settings_reset
            snippet: nrf52840-nosd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: West init
        run: west init -l config

      - name: West update
        run: west update

      - name: West zephyr export
        run: west zephyr-export

      - name: Build ${{ matrix.shield }}
        run: |
          west build -s zmk/app -d "build/${{ matrix.shield }}" -p always \
            -b ${{ matrix.board }} \
            -- -DSHIELD=${{ matrix.shield }} -DZMK_CONFIG="$GITHUB_WORKSPACE/config" \
               -DSNIPPET="${{ matrix.snippet }}"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shield }}-${{ matrix.board }}-zmk
          path: build/${{ matrix.shield }}/zephyr/zmk.uf2
          if-no-files-found: error
